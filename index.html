<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title></title>
	<style>
		img{
			width: 200px;
			height: 250px;
		}
		.subjectgrades{
			display: flex;
 			justify-content: center;
  			gap: 40px;
  			margin-top: 20px;
		}
	</style>
</head>
<body>
<center>
<h1 style="background-color: springgreen; width: 700px;">Score Analyzer</h1>

<details onclick="message1()">
<summary>
	<i>Click Me</i>
	<br>
	<i id="message"></i>
</summary>
</details>
<br><br>

<div class="subjectgrades">
	<div class="subject">
		<img src="https://img.freepik.com/free-vector/colorful-science-objects-icons-vector-set_1308-140707.jpg?semt=ais_hybrid&w=740">
		<input type="number" class="form-control" style="width: 200px;" id="sciencegrade">
	</div>
	<div class="subject">
		<img src="https://schoolizer.com/img/articles_photos/17062655360.jpg">
		<input type="number" class="form-control" style="width: 200px;" id="mathgrade">
	</div>
	<div class="subject">
		<img src="https://classroomcompletepress.com/cdn/shop/collections/Collection_Image_Blank_ff155279-b272-4bb4-bebc-94f756d3d5ee_1024x.jpg?v=1596561631">
		<input type="number" class="form-control" style="width: 200px;" id="socialstudiesgrade">
	</div>
</div>

<br><br>


<button type="Submit" class="btn btn-info" onclick="rating()">Get Rating</button>

<br><br>

<p>Note: Grading Criteria and Equivalents can vary depending on school or district.</p>


<script>
	function message1(){
		document.getElementById("message").innerHTML = "Enter your grades for the following subjects.";
	}

	function rating(){
		var science = document.getElementById("sciencegrade").value;
		var math = document.getElementById("mathgrade").value;
		var socialstudies = document.getElementById("socialstudiesgrade").value;
		var average = (Number(science) + Number(math) + Number(socialstudies)) / 3;

		switch(true){
		case (average >= 94):
			window.alert("You have a grade of " + average + ", you have an excellent average.");
			break;
		case (average >= 87 && average <= 93.99):
			window.alert("You have a grade of " + average + ", you have an above satisfactory average.");
			break;
		case (average >= 80 && average <= 86.99):
			window.alert("You have a grade of " + average + ", you have a satisfactory average.");
			break;
		case (average >= 75 && average <= 79.99):
			window.alert("You have a grade of " + average + ", your average needs improvement");
			break;
		case (average >= 70 && average <= 74.99):
			window.alert("You have a grade of " + average + ", you have a poor average.");
			break;
		default:
			window.alert("nothing");
		}
	}

</script>
</body>
</html>
